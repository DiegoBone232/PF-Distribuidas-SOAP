<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Inventario SOAP</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #34d399;
        --danger: #f87171;
        --border: #334155;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #020617, #111827 70%);
        color: var(--text);
      }

      .app-shell {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }

      header {
        background: rgba(17, 24, 39, 0.95);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        margin-bottom: 24px;
      }

      .brand h1 {
        margin: 0;
        font-size: 1.4rem;
      }

      .brand p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .content {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: auto;
      }

      .panel {
        background: rgba(17, 24, 39, 0.95);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      }

      .form-panel { flex: 1 1 320px; max-width: 360px; }
      .table-panel { flex: 2 1 600px; min-width: 320px; }
      .bottom-row {
        display: flex;
        gap: 20px;
        margin-top: 24px;
        flex-wrap: wrap;
      }
      .bottom-row > .panel {
        flex: 1 1 320px;
        min-width: 320px;
      }
      .map-panel {
        min-height: 420px;
        max-width: 360px;
        align-self: flex-start;
      }
      .weather-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 14px;
        background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(37, 99, 235, 0.15));
        border: 1px solid rgba(56, 189, 248, 0.2);
        min-width: 260px;
      }
      .weather-card .weather-main {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 72px;
      }
      .weather-card img {
        width: 64px;
        height: 64px;
      }
      .weather-card .temp {
        font-size: 1.3rem;
        font-weight: 700;
      }
      .weather-card .description {
        font-size: 0.9rem;
        color: var(--accent);
        text-transform: capitalize;
        margin-bottom: 4px;
      }
      .weather-card .city {
        font-size: 0.8rem;
        color: rgba(255,255,255,0.8);
      }
      .weather-stats {
        display: flex;
        gap: 10px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      .weather-stat {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--muted);
        font-size: 0.78rem;
      }
      .weather-stat strong {
        color: var(--text);
      }

      h2 { margin-top: 0; font-size: 1.1rem; }

      form { display: flex; flex-direction: column; gap: 12px; }
      label { display: flex; flex-direction: column; gap: 6px; font-size: 0.95rem; color: var(--muted); }
      input {
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel-2);
        color: var(--text);
      }

      button {
        border: none;
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }

      .btn-primary {
        background: var(--accent);
        color: #052e16;
      }

      .btn-secondary {
        background: var(--accent-2);
        color: #052e16;
      }

      .message {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 0.95rem;
        display: none;
      }

      .message.success { display: block; background: rgba(52, 211, 153, 0.14); color: #bbf7d0; }
      .message.error { display: block; background: rgba(248, 113, 113, 0.14); color: #fecaca; }

      .table-wrap { overflow-x: auto; }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }
      th, td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid var(--border);
      }
      th { color: var(--muted); font-weight: 600; }
      tbody tr:hover { background: rgba(255,255,255,0.04); }

      @media (max-width: 900px) {
        header { flex-direction: column; align-items: flex-start; gap: 12px; }
        .form-panel, .table-panel { max-width: none; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header>
        <div class="brand">
          <h1>Inventario SOAP</h1>
          <p>Gestión de productos con integración SOAP</p>
        </div>
        <div class="header-actions">
          <div id="weather" class="weather-card" aria-live="polite"></div>
        </div>
      </header>

      <div class="content">
        <section class="panel form-panel">
          <h2>Registrar producto</h2>
          <form id="productoForm">
            <label>
              Código
              <input type="text" id="codigo" required />
            </label>
            <label>
              Nombre
              <input type="text" id="nombre" required />
            </label>
            <label>
              Categoría
              <input type="text" id="categoria" required />
            </label>
            <label>
              Precio
              <input type="number" id="precio" step="0.01" required />
            </label>
            <label>
              Cantidad
              <input type="number" id="cantidad" required />
            </label>
            <button class="btn-primary" type="submit">Guardar</button>
          </form>
          <div id="formMessage" class="message"></div>
        </section>

        <section class="panel table-panel">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
            <h2 style="margin:0;">Inventario actual</h2>
            <button id="refreshBtn" class="btn-secondary" type="button">Actualizar Tabla</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Código</th>
                  <th>Nombre</th>
                  <th>Categoría</th>
                  <th>Precio</th>
                  <th>Cantidad</th>
                </tr>
              </thead>
              <tbody id="tablaInventario">
                <tr>
                  <td colspan="5" style="color: var(--muted);">Sin datos aún.</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div id="tableMessage" class="message"></div>
        </section>
      </div>

      <div class="bottom-row">
        <section class="panel map-panel">
          <h2>Sucursales</h2>
          <div id="mapa" style="height: 300px; border-radius: 10px; z-index: 1;"></div>
        </section>
      </div>
    </div>

    <script>
      const API_KEY = 'a1c13ac2f6029c4f3bd0c076a0e7b94f';
      const WEATHER_URL = 'https://api.openweathermap.org/data/2.5/weather?q=Quito,ec&units=metric&appid=' + API_KEY;
      const SOAP_URL = 'http://localhost:8000/productos';
      const SOAP_NS = 'http://localhost:8000/productos/wsdl';

      const weatherEl = document.getElementById('weather');
      const form = document.getElementById('productoForm');
      const formMessage = document.getElementById('formMessage');
      const tableMessage = document.getElementById('tableMessage');
      const tablaInventario = document.getElementById('tablaInventario');
      const refreshBtn = document.getElementById('refreshBtn');

      async function cargarClima() {
        try {
          if (!API_KEY) {
            weatherEl.innerHTML = '<div class="weather-main"><div>🌤️</div></div><div><div class="temp">Sin clave</div><div class="city">Agrega tu API key</div></div>';
            return;
          }

          const response = await fetch(WEATHER_URL);
          if (!response.ok) throw new Error('No se pudo obtener el clima');

          const data = await response.json();
          const temp = Math.round(data.main.temp);
          const icon = data.weather?.[0]?.icon || '01d';
          const description = data.weather?.[0]?.description || 'Sin descripción';
          const humidity = data.main?.humidity ?? 0;
          const wind = data.wind?.speed ?? 0;

          weatherEl.innerHTML = `
            <div class="weather-main">
              <img src="http://openweathermap.org/img/wn/${icon}@4x.png" alt="${description}" />
            </div>
            <div>
              <div class="temp">${temp}°C</div>
              <div class="description">${description}</div>
              <div class="city">${data.name}, ${data.sys.country}</div>
              <div class="weather-stats">
                <div class="weather-stat"><span>Humedad</span><strong>${humidity}%</strong></div>
                <div class="weather-stat"><span>Viento</span><strong>${wind} m/s</strong></div>
              </div>
            </div>
          `;
        } catch (error) {
          weatherEl.innerHTML = '<div class="weather-main"><div>🌦️</div></div><div><div class="temp">Error</div><div class="city">No se pudo cargar el clima</div></div>';
          console.error(error);
        }
      }

      function mostrarMensaje(elemento, tipo, mensaje) {
        elemento.className = `message ${tipo}`;
        elemento.textContent = mensaje;
      }

      function construirXml(operation, bodyFields = []) {
        const fields = bodyFields.map(({ name, value }) => `<${name}>${value}</${name}>`).join('');
        return `<?xml version="1.0" encoding="UTF-8"?><soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body><tns:${operation} xmlns="${SOAP_NS}">${fields}</tns:${operation}></soap:Body></soap:Envelope>`;
      }

      async function enviarSoap(xml, operationName) {
        const response = await fetch(SOAP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/xml' },
          body: xml,
        });

        const text = await response.text();
        if (!response.ok) {
          throw new Error(`Error HTTP ${response.status}: ${text}`);
        }
        return text;
      }

      function parsearInventario(xmlText) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(xmlText, 'application/xml');
        const productos = Array.from(doc.getElementsByTagName('producto'));
        return productos.map((producto) => ({
          codigo: producto.getElementsByTagName('codigo')[0]?.textContent || '',
          nombre: producto.getElementsByTagName('nombre')[0]?.textContent || '',
          categoria: producto.getElementsByTagName('categoria')[0]?.textContent || '',
          precio: producto.getElementsByTagName('precio')[0]?.textContent || '',
          cantidad: producto.getElementsByTagName('cantidad')[0]?.textContent || '',
        }));
      }

      function renderTabla(productos) {
        if (!productos.length) {
          tablaInventario.innerHTML = '<tr><td colspan="5" style="color: var(--muted);">No hay productos registrados.</td></tr>';
          return;
        }

        tablaInventario.innerHTML = productos.map((producto) => `
          <tr>
            <td>${producto.codigo}</td>
            <td>${producto.nombre}</td>
            <td>${producto.categoria}</td>
            <td>${producto.precio}</td>
            <td>${producto.cantidad}</td>
          </tr>
        `).join('');
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          const codigo = document.getElementById('codigo').value.trim();
          const nombre = document.getElementById('nombre').value.trim();
          const categoria = document.getElementById('categoria').value.trim();
          const precio = document.getElementById('precio').value.trim();
          const cantidad = document.getElementById('cantidad').value.trim();

          const xml = construirXml('RegistrarProductoRequest', [
            { name: 'codigo', value: codigo },
            { name: 'nombre', value: nombre },
            { name: 'categoria', value: categoria },
            { name: 'precio', value: precio },
            { name: 'cantidad', value: cantidad },
          ]);

          const responseText = await enviarSoap(xml, 'RegistrarProducto');
          const lower = responseText.toLowerCase();
          if (lower.includes('fault') || lower.includes('false')) {
            mostrarMensaje(formMessage, 'error', 'No fue posible guardar el producto.');
          } else {
            mostrarMensaje(formMessage, 'success', 'Producto guardado correctamente.');
            form.reset();
          }
        } catch (error) {
          mostrarMensaje(formMessage, 'error', 'Error al registrar el producto: ' + error.message);
          console.error(error);
        }
      });

      refreshBtn.addEventListener('click', async () => {
        try {
          const xml = construirXml('ListarProductosRequest');
          const responseText = await enviarSoap(xml, 'ListarProductos');
          const lower = responseText.toLowerCase();
          if (lower.includes('fault') || lower.includes('false')) {
            mostrarMensaje(tableMessage, 'error', 'No fue posible listar los productos.');
          } else {
            const productos = parsearInventario(responseText);
            renderTabla(productos);
            mostrarMensaje(tableMessage, 'success', 'Tabla actualizada correctamente.');
          }
        } catch (error) {
          mostrarMensaje(tableMessage, 'error', 'Error al actualizar la tabla: ' + error.message);
          console.error(error);
        }
      });

      function inicializarMapa() {
        const mapa = L.map('mapa').setView([-0.1807, -78.4678], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(mapa);

        const sucursales = [
          { nombre: 'Almacén Centro', coordenadas: [-0.1807, -78.4678] },
          { nombre: 'Sucursal Norte', coordenadas: [-0.1000, -78.4800] },
          { nombre: 'Sucursal Sur', coordenadas: [-0.2500, -78.5200] },
        ];

        const marcadores = sucursales.map((sucursal) => {
          const marcador = L.marker(sucursal.coordenadas)
            .addTo(mapa)
            .bindPopup(sucursal.nombre);
          return marcador;
        });

        const bounds = L.featureGroup(marcadores).getBounds();
        mapa.fitBounds(bounds, { padding: [15, 15] });
      }

      cargarClima();
      refreshBtn.click();
      inicializarMapa();
    </script>
  </body>
</html>
